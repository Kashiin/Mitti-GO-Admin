spring:
  application:
    name: mitti-go-admin
  config:
    import: optional:file:./application-local.yaml
  thymeleaf:
    cache: false
  servlet:
    multipart:
      # Channel lists for import: a few hundred rows.
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8081
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict
        # true on the real server (HTTPS), via ADMIN_SECURE_COOKIE
        secure: ${ADMIN_SECURE_COOKIE:false}

mittigo:
  # The Mitti GO server's API; the panel holds no database or YouTube key of its own.
  backend-url: ${BACKEND_URL:http://localhost:8080/api/v1}
