<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Журнал изменений')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments :: side}"></aside>
    <main class="main">
        <div class="page">
            <h1>Журнал изменений</h1>
            <p class="lead">Кто и что менял в админке — последние 200 записей, время по Ташкенту.</p>

            <div class="tabs">
                <a th:each="g : ${groups}" th:href="@{/audit(group=${g.key})}"
                   th:classappend="${g.key == group} ? 'active'" th:text="${g.value}">Все</a>
            </div>

            <div class="card">
                <p class="muted" th:if="${#lists.isEmpty(audit)}">Пока ничего.</p>
                <div class="table-scroll" data-fill th:unless="${#lists.isEmpty(audit)}" tabindex="0" aria-label="Журнал изменений">
                <table>
                    <thead><tr><th>Когда</th><th>Кто</th><th>Что</th><th>Подробности</th></tr></thead>
                    <tbody>
                    <tr th:each="entry : ${audit}">
                        <td class="muted" th:text="${entry.when}"></td>
                        <td th:text="${entry.admin}"></td>
                        <td><b th:text="${entry.what}"></b></td>
                        <td th:text="${entry.details}"></td>
                    </tr>
                    </tbody>
                </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
