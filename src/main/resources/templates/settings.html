<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Настройки')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments :: side}"></aside>
    <main class="main">
        <div class="page">
            <h1>Настройки приложения</h1>
            <p class="lead">Ключ → значение, приложение получает их вместе с конфигом. Например,
                <b>MIN_APP_VERSION_ANDROID</b> = 1.0.3 — принудительное обновление после серьёзной ошибки.</p>

            <div th:replace="~{fragments :: flash}"></div>

            <div class="card">
                <h2>Добавить или изменить</h2>
                <form class="form-line" th:action="@{/settings}" method="post">
                    <div class="grow">
                        <label for="key">Ключ</label>
                        <input id="key" name="key" type="text" required maxlength="64" placeholder="MIN_APP_VERSION_ANDROID">
                    </div>
                    <div class="grow">
                        <label for="value">Значение</label>
                        <input id="value" name="value" type="text" required maxlength="200">
                    </div>
                    <button type="submit">Сохранить</button>
                </form>
            </div>

            <div class="card">
                <p class="muted" th:if="${#lists.isEmpty(settings)}">Настроек пока нет.</p>
                <div class="rows rows-scroll">
                    <div class="row" th:each="s : ${settings}">
                        <div class="row-main">
                            <div class="row-title" th:text="${s.key}">KEY</div>
                            <div class="row-sub" th:text="${s.value}">value</div>
                        </div>
                        <form th:action="@{/settings/{key}/delete(key=${s.key})}" method="post">
                            <button class="danger small">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
